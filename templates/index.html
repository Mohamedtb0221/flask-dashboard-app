<!DOCTYPE html>
<!-- Coding By CodingNepal - codingnepalweb.com -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.5.0/Chart.min.js"></script>

    <!----======== CSS ======== -->
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}" />

    <!----===== Iconscout CSS ===== -->
    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v4.0.0/css/line.css"
    />

    <title>Admin Dashboard Panel</title>
  </head>
  <body>
    <nav class="close">
      <div class="logo-name">
        <div class="logo-image">
          <img src="/static/cropped-logo_usthb.png" alt="" />
        </div>

        <span class="logo_name">Pravan</span>
      </div>

      <div class="menu-items">
        <ul class="nav-links">
          <li>
            <a href="#">
              <i class="uil uil-estate"></i>
              <span class="link-name">Dahsboard</span>
            </a>
          </li>
          <li>
            <a href="{{ url_for('index1') }}">
              <i class="uil uil-files-landscapes"></i>
              <span class="link-name">Content</span>
            </a>
          </li>
          <li>
            <a href="{{ url_for('index2') }}">
              <i class="uil uil-chart"></i>
              <span class="link-name">Analytics</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <section class="dashboard">
      <div class="top">
        <i class="uil uil-bars sidebar-toggle"></i>

        <div class="search-box">
          <i class="uil uil-redo"></i>
          <input type="button" value="Refresh..." onclick="loadData()" />
        </div>

        <!--<img src="images/profile.jpg" alt="">-->
      </div>

      <div class="dash-content">
        <div class="overview">
          <div class="title">
            <i class="uil uil-book-reader"></i>
            <span class="text">Our students</span>
          </div>
          <fieldset class="boxes">
            <legend>Number of students by major for 2021 :</legend>
            <div class="box box1">
              <span class="text"></span>
              <p style="font-size: 20px; font-weight: 600; color: white">
                <span class="number"></span>
              </p>
            </div>
            <div class="box box2">
              <span class="text"></span>
              <p style="font-size: 20px; font-weight: 600">
                <span class="number"></span>
              </p>
            </div>
            <div class="box box3">
              <span class="text"></span>
              <p style="font-size: 20px; font-weight: 600">
                <span class="number"></span>
              </p>
            </div>

            <div class="box box4">
              <span class="text"></span>
              <p style="font-size: 20px; font-weight: 600">
                <span class="number"></span>
              </p>
            </div>
            <div class="box box5">
              <span class="text"></span>
              <p style="font-size: 20px; font-weight: 600">
                <span class="number"></span>
              </p>
            </div>
            <div class="box box6">
              <span class="text"></span>
              <p style="font-size: 20px; font-weight: 600">
                <span class="number"></span>
              </p>
            </div>
            <div class="box box7">
              <span class="text"></span>
              <p style="font-size: 20px; font-weight: 600">
                <span class="number"></span>
              </p>
            </div>
            <div class="box box8">
              <span class="text"></span>
              <p style="font-size: 20px; font-weight: 600">
                <span class="number"></span>
              </p>
            </div>
          </fieldset>
        </div>

        <div class="title">
          <i class="uil uil-comparison"></i>
          <span class="text">Data visualisation</span>
        </div>
        <div class="chart1">
          <div class="card-content">
            <canvas id="line-chart"></canvas>
          </div>
          <div class="card-header">
            <p class="chart-title">Evolution of students number per year</p>
          </div>
        </div>
        <div class="charts">
          <div class="chart2">
            <div>
              <label for="years">Choose a year:</label>
              <select name="years" id="years">
                <option value="2021">2021</option>
                <option value="2020">2020</option>
                <option value="2019">2019</option>
              </select>
            </div>
            <div class="card-content">
              <canvas id="pie-chart"></canvas>
            </div>
            <div class="card-header">
              <p class="chart-title title1">number of students per major</p>
            </div>
          </div>
          <div class="chart3">
            <div>
              <label for="years1">Choose a year :</label>
              <select name="years1" id="years1">
                <option value="2021">2021</option>
                <option value="2020">2020</option>
                <option value="2019">2019</option>
              </select>
              <label for="majors">Choose a major :</label>
              <select name="majors" id="majors">
                <option value="SPECIALITE_1">SPECIALITE_1</option>
                <option value="SPECIALITE_2">SPECIALITE_2</option>
                <option value="SPECIALITE_3">SPECIALITE_3</option>
                <option value="SPECIALITE_4">SPECIALITE_4</option>
                <option value="SPECIALITE_5">SPECIALITE_5</option>
                <option value="SPECIALITE_6">SPECIALITE_6</option>
                <option value="SPECIALITE_7">SPECIALITE_7</option>
              </select>
            </div>
            <div class="card-content">
              <canvas id="pie-chart1"></canvas>
            </div>
            <div class="card-header">
              <p class="chart-title title2">fail and success percentage per major</p>
            </div>
          </div>
        </div>
        <div class="charts">
          <div class="chart2">
            <div class="chart4">
              <div>
                <label for="gender_years">Choose a year :</label>
                <select name="gender_years" id="genderYears">
                  <option value="2021">2021</option>
                  <option value="2020">2020</option>
                  <option value="2019">2019</option>
                </select>
                
              </div>
              <div class="card-content">
                <canvas id="radar-chart"></canvas>
              </div>
              <div class="card-header">
                <p class="chart-title title3">Gender of students per major</p>
              </div>
            </div>
          </div>
          <div class="chart3">
            <div class="chart5">
              
              <div class="card-content">
                <canvas id="doughnut-chart"></canvas>
              </div>
              <div class="card-header">
                <p class="chart-title title4">number of students per year</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="{{url_for('static', filename='script.js')}}"></script>
  </body>
</html>
